<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Bakerz Bite Bakery</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/site-features.css">
  </head>
  <body style="background: radial-gradient(circle at center, #FFF9E6 0%, var(--bb-cream) 100%); min-height: 100vh; display: flex; flex-direction: column;">

    
    <div class="py-4 text-center position-relative">
      <a href="index.html" aria-label="Bakerz Bite Homepage">
        <img src="assets/images/bakerz-bite-logo.webp" alt="Bakerz Bite" height="56" />
      </a>
      <a href="index.html" class="btn btn-bb btn-bb-outline rounded-circle position-absolute top-0 end-0 m-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; padding: 0;" aria-label="Close sign up and return to storefront" title="Back to Storefront">
        <i class="bi bi-x-lg"></i>
      </a>
    </div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
      <div class="clay-card p-4 p-md-5" style="max-width: 460px; width: 100%; background: white;">
        <div class="text-center mb-4">
          <span class="fs-1 anim-float d-inline-block">🍓</span>
          <h3 class="brand-font mb-1">Join the Sweet Family</h3>
          <p class="text-muted small">Sign up today and get <strong>100 bonus loyalty points</strong> instantly!</p>
        </div>

        <form id="demoSignupForm">
          <div class="mb-3">
            <label class="form-label small fw-bold" for="signupFullName">Full Name *</label>
            <input type="text" id="signupFullName" name="fullname" class="form-control form-control-bb" placeholder="e.g. Zainab Tariq" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold" for="signupEmail">Email Address *</label>
            <input type="email" id="signupEmail" name="email" class="form-control form-control-bb" placeholder="e.g. zainab@example.com" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold" for="signupPhone">Phone Number</label>
            <input type="tel" id="signupPhone" name="phone" class="form-control form-control-bb" placeholder="e.g. 0321 9876543" autocomplete="tel">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold" for="signupPassword">Create Password *</label>
            <div class="input-group">
              <input type="password" id="signupPassword" name="password" class="form-control form-control-bb border-end-0" placeholder="Minimum 6 characters" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary password-toggle-btn border-start-0" type="button" aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-check mb-3 small">
            <input class="form-check-input" type="checkbox" id="termsCheck" checked required>
            <label class="form-check-label text-muted" for="termsCheck">
              I agree to the demo bakery terms & privacy policy.
            </label>
          </div>

          <button type="submit" class="btn btn-bb btn-bb-primary w-100 py-2 fs-6">
            Create Free Account
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          Already have an account? <a href="login.html" class="fw-bold text-danger">Sign In Here</a>
        </div>
      </div>
    </main>

    <div class="py-3 text-center text-muted small">
      © 2026 Bakerz Bite Patisserie · <a href="index.html" class="text-muted">Return to Storefront</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/site-features.js"></script>
  </body>
</html>
