<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Login - Bakerz Bite Bakery</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body style="background: radial-gradient(circle at center, #FDEBF2 0%, var(--bb-cream) 100%); min-height: 100vh; display: flex; flex-direction: column;">

    
    <div class="py-4 text-center position-relative">
      <a href="index.html" aria-label="Bakerz Bite Homepage">
        <img src="assets/images/bakerz-bite-logo.webp" alt="Bakerz Bite" height="56" />
      </a>
      <a href="index.html" class="btn btn-bb btn-bb-outline rounded-circle position-absolute top-0 end-0 m-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; padding: 0;" aria-label="Close sign in and return to storefront" title="Back to Storefront">
        <i class="bi bi-x-lg"></i>
      </a>
    </div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
      <div class="clay-card p-4 p-md-5" style="max-width: 440px; width: 100%; background: white;">
        <div class="text-center mb-4">
          <span class="fs-1 anim-float d-inline-block">🧁</span>
          <h3 class="brand-font mb-1">Welcome Back!</h3>
          <p class="text-muted small">Sign in to check your orders, points, and saved cake designs.</p>
        </div>

        <form id="demoLoginForm">
          <div class="mb-3">
            <label class="form-label small fw-bold" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" name="email" class="form-control form-control-bb" placeholder="e.g. ayesha.khan@example.com" value="ayesha.khan@example.com" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold" for="loginPassword">Password</label>
            <div class="input-group">
              <input type="password" id="loginPassword" name="password" class="form-control form-control-bb border-end-0" value="sweetsecret123" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary password-toggle-btn border-start-0" type="button" aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3 small">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <button type="button" class="btn btn-link text-danger p-0 border-0 align-baseline small text-decoration-none" onclick="BakerzToasts.show('Demo password reset link simulated', 'info', '🔑')">Forgot password?</button>
          </div>

          <button type="submit" class="btn btn-bb btn-bb-primary w-100 py-2 fs-6">
            Sign In to Account
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          Don't have an account yet? <a href="signup.html" class="fw-bold text-danger">Create Demo Account</a>
        </div>
      </div>
    </main>

    <div class="py-3 text-center text-muted small">
      © 2026 Bakerz Bite Patisserie · <a href="index.html" class="text-muted">Return to Storefront</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/forms.js"></script>
  </body>
</html>
