<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Basket - Bakerz Bite Bakery</title>
    <meta name="description" content="Review your freshly baked treats, apply discount vouchers, and checkout." />
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/site-features.css">
  </head>
  <body>

    <div id="readingProgressBar"></div>

    <!-- Navigation Bar -->
    <header class="bakerz-navbar">
      <div class="container-custom d-flex align-items-center justify-content-between">
        <a href="index.html" class="navbar-brand-logo" aria-label="Bakerz Bite Homepage">
          <img src="assets/images/bakerz-bite-logo.webp" alt="Bakerz Bite Logo" height="52" />
        </a>

        <nav class="d-none d-lg-flex align-items-center gap-1 navbar-nav-desktop">
          <a href="index.html" class="nav-link-bb">Home</a>
          <a href="menu.html" class="nav-link-bb">Explore Menu</a>
          <a href="about.html" class="nav-link-bb">About Us</a>
          <a href="cake-studio.html" class="nav-link-bb">Cake Studio</a>
          <a href="gallery.html" class="nav-link-bb">Gallery</a>
          <a href="offers.html" class="nav-link-bb">Offers</a>
          <a href="contact.html" class="nav-link-bb">Contact</a>
        </nav>

        <div class="d-flex align-items-center gap-2">
          <a href="login.html" class="nav-action-btn" aria-label="Account"><i class="bi bi-person"></i></a>
          <a href="menu.html" class="btn btn-bb btn-bb-outline btn-bb-sm">Continue Shopping</a>
        </div>
      </div>
    </header>

    <!-- Cart Page Content -->
    <main class="py-5 bg-white">
      <div class="container-custom">
        <h1 class="display-5 fw-bold brand-font mb-4">Your Shopping Basket</h1>

        <div class="row g-4" id="cartPageLayout">
          
          <!-- Left: Items List -->
          <div class="col-lg-8">
            <div class="clay-card p-4">
              <div id="cartPageItemsList">
                <!-- Dynamically rendered -->
              </div>
            </div>
          </div>

          <!-- Right: Summary & Checkout Button -->
          <div class="col-lg-4">
            <div class="clay-card p-4" style="background: var(--bb-cream);">
              <h4 class="brand-font mb-3">Order Summary</h4>
              
              <div id="cartPageSummaryDetails">
                <!-- Dynamically rendered -->
              </div>

              <form class="my-3 bb-promo-form" onsubmit="applyCartPagePromo(); return false;">
                <label for="cartPagePromoInput" class="small fw-bold text-muted mb-1">Have a promo voucher?</label>
                <div class="d-flex gap-2">
                  <input type="text" id="cartPagePromoInput" class="form-control form-control-bb small" placeholder="e.g. SWEET10" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="cartPagePromoInputFeedback">
                  <button type="submit" class="btn btn-bb btn-bb-yellow btn-bb-sm">Apply</button>
                </div>
                <div id="cartPagePromoInputFeedback" class="small mt-1" role="status"></div>
                <button type="button" class="btn btn-link text-muted btn-sm p-0 mt-1" onclick="BakerzCart.removePromo('cartPagePromoInput'); renderFullCartPage()">Remove applied code</button>
              </form>

              <a href="checkout.html" class="btn btn-bb btn-bb-primary w-100 py-3 mt-2" id="proceedToCheckoutBtn">
                Proceed to Checkout <i class="bi bi-arrow-right"></i>
              </a>

              <div class="text-center mt-3">
                <small class="text-muted"><i class="bi bi-shield-check text-success"></i> 100% Satisfaction Guaranteed</small>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bakerz-footer">
      <div class="container-custom text-center text-white-50 small">
        <a href="index.html" class="d-inline-block mb-3">
          <img loading="lazy" decoding="async" src="assets/images/bakerz-bite-logo.webp" alt="Bakerz Bite Logo" height="52" />
        </a>
        <p class="mb-0">Bakerz Bite Patisserie · Handcrafted Daily · Karachi Flagship</p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/main.js"></script>

    <script>
      function renderFullCartPage() {
        const items = BakerzCart.getItems();
        const summary = BakerzCart.getSummary();
        const listContainer = document.getElementById('cartPageItemsList');
        const summaryContainer = document.getElementById('cartPageSummaryDetails');
        const checkoutBtn = document.getElementById('proceedToCheckoutBtn');

        if (!listContainer || !summaryContainer) return;

        if (items.length === 0) {
          listContainer.innerHTML = `
            <div class="text-center py-5">
              <div style="font-size: 4rem;" class="anim-float">🧁</div>
              <h3 class="brand-font mt-3">Your Basket is Empty</h3>
              <p class="text-muted">Explore our delicious freshly baked bread, cakes, and croissants!</p>
              <a href="menu.html" class="btn btn-bb btn-bb-pink mt-2">Explore Sweet Menu</a>
            </div>
          `;
          summaryContainer.innerHTML = '<p class="text-muted small">No items to calculate.</p>';
          if (checkoutBtn) checkoutBtn.classList.add('disabled');
          return;
        }

        if (checkoutBtn) checkoutBtn.classList.remove('disabled');

        const escape = BakerzCart.escapeHtml || (s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'));

        let html = '';
        items.forEach((item, index) => {
          const safeName = escape(item.name);
          const safeNotes = escape(item.notes);
          html += `
            <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between p-3 mb-2 bg-light rounded-3 border">
              <div class="d-flex align-items-center gap-3" style="flex: 1 1 220px; min-width: 0;">
                <div class="cart-item-img position-relative overflow-hidden ${item.placeholderBg || 'placeholder-bg-cake'}" style="width: 58px; height: 58px; border-radius: 12px; flex-shrink: 0; background: var(--bb-cream);">
                  <img loading="lazy" decoding="async" src="${item.imageAsset || ''}" alt="${safeName}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null; this.style.display='none'; if (this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                  <span style="display: ${item.imageAsset ? 'none' : 'flex'}; width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 1.6rem;">${item.icon || '🧁'}</span>
                </div>
                <div style="min-width: 0;">
                  <h6 class="mb-0 brand-font">${safeName}</h6>
                  <div class="small text-muted">Rs. ${Number(item.price || 0).toLocaleString()} each</div>
                  ${item.notes ? `<div class="badge bg-white text-dark border small mt-1 text-wrap text-start font-monospace" style="font-size: 0.72rem;">${safeNotes}</div>` : ''}
                </div>
              </div>
              <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-1">
                  <button type="button" class="cart-qty-btn" data-cart-page-action="dec" data-item-index="${index}">-</button>
                  <span class="px-2 fw-bold">${item.quantity}</span>
                  <button type="button" class="cart-qty-btn" data-cart-page-action="inc" data-item-index="${index}">+</button>
                </div>
                <div class="fw-bold brand-font text-danger" style="min-width: 90px; text-align: right;">
                  Rs. ${(item.price * item.quantity).toLocaleString()}
                </div>
                <button type="button" class="btn btn-link text-danger p-0" aria-label="Remove item" data-cart-page-action="remove" data-item-index="${index}">
                  <i class="bi bi-trash3"></i>
                </button>
              </div>
            </div>
          `;
        });
        listContainer.innerHTML = html;

        if (!listContainer._boundPageDelegation) {
          listContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-cart-page-action]');
            if (!btn) return;
            const action = btn.getAttribute('data-cart-page-action');
            const idx = parseInt(btn.getAttribute('data-item-index'), 10);
            const currentItems = BakerzCart.getItems();
            if (isNaN(idx) || !currentItems[idx]) return;

            if (action === 'dec') {
              BakerzCart.updateQuantityByIndex(idx, currentItems[idx].quantity - 1);
            } else if (action === 'inc') {
              BakerzCart.updateQuantityByIndex(idx, currentItems[idx].quantity + 1);
            } else if (action === 'remove') {
              BakerzCart.removeItemByIndex(idx);
            }
            renderFullCartPage();
          });
          listContainer._boundPageDelegation = true;
        }

        summaryContainer.innerHTML = `
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Subtotal:</span>
            <span class="fw-bold">Rs. ${summary.subtotal.toLocaleString()}</span>
          </div>
          ${summary.discount > 0 ? `
            <div class="d-flex justify-content-between mb-2 text-success">
              <span>Voucher Discount (${escape(summary.promo)}):</span>
              <span>- Rs. ${summary.discount.toLocaleString()}</span>
            </div>
          ` : ''}
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Delivery:</span>
            <span>${summary.deliveryFee === 0 ? '<span class="badge bg-success text-white">FREE</span>' : 'Rs. ' + summary.deliveryFee}</span>
          </div>
          <div class="border-top pt-2 d-flex justify-content-between align-items-center mb-3">
            <span class="fw-bold brand-font fs-5">Total:</span>
            <span class="fw-bold brand-font text-danger fs-4">Rs. ${summary.total.toLocaleString()}</span>
          </div>
          <div class="p-2 rounded bg-warning-subtle text-dark small mb-3">
            <i class="bi bi-stars text-warning"></i> You will earn <strong>${summary.points}</strong> Sweet Loyalty points on this order!
          </div>
        `;
      }

      function applyCartPagePromo() {
        if (BakerzCart.applyPromo('cartPagePromoInput')) renderFullCartPage();
      }

      document.addEventListener('DOMContentLoaded', renderFullCartPage);
    </script>
    <script src="js/site-features.js"></script>
  </body>
</html>
